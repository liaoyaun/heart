<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>怦然心动</title>
<style>
*{margin:0;padding:0}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#000;}
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W=800, H=800;
const center_x = W/2, center_y = H/2;
const color="#FF69B4";
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + "px";
canvas.style.height = H + "px";
ctx.scale(dpr, dpr);
function heart_func(t, scale=19){
    let x = 16 * Math.pow(Math.sin(t),3);
    let y = -(13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    return [x*scale + center_x, y*scale + center_y];
}
let particles = [];
for(let i=0;i<9000;i++){
    let t = Math.random()*Math.PI*2;
    let [x,y] = heart_func(t);
    let beta=0.18;
    let rx = -beta * Math.log(Math.random());
    let ry = -beta * Math.log(Math.random());
    let nx = x - rx*(x-center_x);
    let ny = y - ry*(y-center_y);
    particles.push({
        x:nx,
        y:ny,
        ox:nx,
        oy:ny,
        size: 1.2 + Math.random()*0.8
    });
}
let frame=0;
function loop(){
    ctx.clearRect(0,0,W,H);
    let p = frame / 120 * Math.PI;
    let ratio = 10 * (2 * Math.sin(4*p)) / (2*Math.PI);
    for(let pt of particles){
        let dx = pt.ox - center_x;
        let dy = pt.oy - center_y;
        let force = 1 / Math.pow(dx*dx + dy**2, 0.42);
        let randomDir = Math.random()>0.5 ? 1 : -1;
        let offX = ratio * force * dx + randomDir;
        let offY = ratio * force * dy + randomDir;
        pt.x = pt.ox - offX;
        pt.y = pt.oy - offY;
        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
        ctx.fill();
    }
    frame++;
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
